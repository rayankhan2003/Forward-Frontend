<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forward System Admin Portal</title>
    <meta name="description" content="Forward System Admin Portal – manage campuses, students, faculty and reports.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-container">

    <!-- ── Sidebar ── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-text">Forward System</span>
            <span class="logo-subtext">ADMIN PORTAL</span>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li class="{{ 'active' if active_page == 'dashboard' else '' }}">
                    <a href="/">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        DASHBOARD
                    </a>
                </li>
                <li class="{{ 'active' if active_page == 'campuses' else '' }}">
                    <a href="/campuses">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        CAMPUSES
                    </a>
                </li>
                <li class="{{ 'active' if active_page == 'students' else '' }}">
                    <a href="/students">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        STUDENTS
                    </a>
                </li>
                <li class="{{ 'active' if active_page == 'faculty' else '' }}">
                    <a href="/faculty">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        FACULTY
                    </a>
                </li>
                <li class="{{ 'active' if active_page == 'reports' else '' }}">
                    <a href="/reports">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="6" height="18"/><rect x="9" y="8" width="6" height="13"/><rect x="16" y="13" width="6" height="8"/></svg>
                        REPORTS
                    </a>
                </li>

            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="/reports" class="btn btn-primary" style="text-align:center;text-decoration:none;display:block;">+ View Reports</a>
        </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main-content">

        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Menu" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
               
               
                {% if active_page in ['dashboard', 'students', 'faculty'] %}
                <nav class="campus-tabs">
                    <a href="?campus=" class="campus-tab active" data-campus="all">All Campuses</a>
                    <a href="?campus=boys_school" class="campus-tab" data-campus="boys_school">Boys School</a>
                    <a href="?campus=girls_school" class="campus-tab" data-campus="girls_school">Girls School</a>
                    <a href="?campus=girls_college" class="campus-tab" data-campus="girls_college">Girls College</a>
                </nav>
                {% endif %}
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">Admin User</span>
                        <span class="user-role">SUPER ADMINISTRATOR</span>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0F172A&color=fff&size=80" alt="Avatar" class="avatar">
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script>
    // Campus tab switching — highlights active tab and preserves query params
    (function() {
        const params = new URLSearchParams(window.location.search);
        const currentCampus = params.get('campus') || '';
        document.querySelectorAll('.campus-tab').forEach(tab => {
            tab.classList.remove('active');
            const tabCampus = tab.dataset.campus === 'all' ? '' : tab.dataset.campus;
            if (tabCampus === currentCampus) tab.classList.add('active');

            // Click handler: preserve existing query params, only change campus
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                const newParams = new URLSearchParams(window.location.search);
                if (tabCampus) {
                    newParams.set('campus', tabCampus);
                } else {
                    newParams.delete('campus');
                }
                // Reset page to 1 when switching campus
                newParams.delete('page');
                const qs = newParams.toString();
                window.location.href = window.location.pathname + (qs ? '?' + qs : '');
            });
        });
        const sel = document.getElementById('school-select');
        if (sel) sel.value = currentCampus;
    })();

    // Mobile Sidebar Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    if (mobileMenuBtn && sidebar && sidebarOverlay) {
        mobileMenuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('open');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
        });
    }
</script>
</body>
</html>
